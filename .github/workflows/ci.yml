name: Verify Avenor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore Avenor.sln --locked-mode
      - run: dotnet test backend/Avenor.Tests/Avenor.Tests.csproj --configuration Release --no-restore
      - run: npm ci && npm run build && npm test
        working-directory: frontend

  sql-server-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/health; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - run: python3 scripts/smoke.py http://localhost:8080
      - name: Container diagnostics
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
