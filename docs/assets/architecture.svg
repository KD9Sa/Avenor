<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Avenor application architecture</title>
  <desc id="desc">An Angular browser connects through Nginx to an ASP.NET Core modular monolith backed by SQL Server. The monolith separates API, Application, Domain and Infrastructure. Authentication, antiforgery checks, role checks, ownership checks and tenant query filters protect each request.</desc>
  <defs>
    <style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#1C2940}.muted{fill:#637086}.white{fill:#fff}.eyebrow{font-size:11px;font-weight:600;letter-spacing:1.5px}.heading{font-size:19px;font-weight:600;letter-spacing:-.3px}.body{font-size:13px}.small{font-size:12px}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#7386A3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="1440" height="800" rx="16" fill="#F6F7F9"/>
  <text x="56" y="58" class="eyebrow muted">AVENOR / ENGINEERING</text>
  <text x="56" y="105" font-size="34" font-weight="650" letter-spacing="-1">One application. Clear boundaries.</text>
  <text x="56" y="138" class="body muted">A modular monolith keeps business rules cohesive and deployment straightforward.</text>

  <rect x="56" y="206" width="232" height="166" rx="10" fill="#fff" stroke="#E5E9F0"/>
  <rect x="76" y="226" width="36" height="36" rx="8" fill="#EEF2FF"/>
  <rect x="85" y="235" width="18" height="14" rx="2" fill="none" stroke="#3659E3" stroke-width="1.7"/><path d="M90 253h8m-4-4v4" stroke="#3659E3" stroke-width="1.7" stroke-linecap="round"/>
  <text x="76" y="296" class="heading">Angular workspace</text>
  <text x="76" y="322" class="body muted">Standalone components</text>
  <text x="76" y="344" class="body muted">Signals · strict TypeScript</text>

  <path d="M288 288h56" fill="none" stroke="#7386A3" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="352" y="206" width="212" height="166" rx="10" fill="#fff" stroke="#E5E9F0"/>
  <text x="372" y="246" class="eyebrow muted">SAME ORIGIN</text>
  <text x="372" y="296" class="heading">Nginx edge</text>
  <text x="372" y="322" class="body muted">Static Angular assets</text>
  <text x="372" y="344" class="body muted">/api reverse proxy</text>

  <path d="M564 288h56" fill="none" stroke="#7386A3" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="628" y="190" width="432" height="434" rx="12" fill="#fff" stroke="#CAD4ED" stroke-width="1.5"/>
  <path d="M640 190h408a12 12 0 0 1 12 12v74H628v-74a12 12 0 0 1 12-12" fill="#13243C"/>
  <text x="652" y="223" class="eyebrow" style="fill:#B2BED0">MODULAR MONOLITH</text>
  <text x="652" y="253" class="white heading">ASP.NET Core 10</text>
  <rect x="652" y="294" width="384" height="60" rx="6" fill="#EEF2FF"/>
  <text x="670" y="318" font-size="14" font-weight="600">API</text>
  <text x="670" y="339" class="small muted">HTTP · cookie authentication · validation · SSE</text>
  <path d="M844 356v13" stroke="#7386A3" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="652" y="379" width="384" height="60" rx="6" fill="#F6F7F9"/>
  <text x="670" y="403" font-size="14" font-weight="600">Application</text>
  <text x="670" y="424" class="small muted">Use cases · DTO contracts · orchestration</text>
  <path d="M844 441v13" stroke="#7386A3" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="652" y="464" width="384" height="60" rx="6" fill="#F6F7F9"/>
  <text x="670" y="488" font-size="14" font-weight="600">Domain</text>
  <text x="670" y="509" class="small muted">Ticket state · assignment strategies · SLA rules</text>
  <rect x="652" y="542" width="384" height="58" rx="6" fill="#FFF4DF"/>
  <text x="670" y="566" font-size="14" font-weight="600">Infrastructure</text>
  <text x="670" y="587" class="small muted">EF Core · tenant filters · hashing · persistence</text>

  <path d="M1060 288h56" fill="none" stroke="#7386A3" stroke-width="1.7" marker-end="url(#arrow)"/>
  <rect x="1124" y="206" width="260" height="166" rx="10" fill="#fff" stroke="#E5E9F0"/>
  <ellipse cx="1162" cy="240" rx="16" ry="6" fill="none" stroke="#3659E3" stroke-width="1.7"/>
  <path d="M1146 240v18c0 8 32 8 32 0v-18m-32 9c0 8 32 8 32 0" fill="none" stroke="#3659E3" stroke-width="1.7"/>
  <text x="1144" y="296" class="heading">SQL Server 2022</text>
  <text x="1144" y="322" class="body muted">Normalized relational schema</text>
  <text x="1144" y="344" class="body muted">Tenant indexes · concurrency</text>

  <path d="M628 327H602v92H172v-34" fill="none" stroke="#7386A3" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <rect x="241" y="405" width="301" height="28" rx="14" fill="#F6F7F9"/>
  <text x="391" y="424" text-anchor="middle" class="small muted">Tenant-scoped SSE invalidation events</text>
  <rect x="56" y="478" width="508" height="146" rx="10" fill="#fff" stroke="#E5E9F0"/>
  <text x="80" y="512" class="eyebrow muted">BUSINESS MODULES</text>
  <text x="80" y="543" font-size="14" font-weight="600">Identity</text><text x="190" y="543" class="body muted">Organizations · users · roles</text>
  <text x="80" y="572" font-size="14" font-weight="600">Support</text><text x="190" y="572" class="body muted">Tickets · conversations · customers</text>
  <text x="80" y="601" font-size="14" font-weight="600">Operations</text><text x="190" y="601" class="body muted">SLA · audit · notifications · reporting</text>
  <rect x="1124" y="416" width="260" height="208" rx="10" fill="#fff" stroke="#E5E9F0"/>
  <text x="1148" y="452" class="eyebrow muted">LOCAL DEVELOPMENT</text>
  <text x="1148" y="489" font-size="16" font-weight="600">Explicit SQLite provider</text>
  <text x="1148" y="520" class="body muted">Real relational persistence</text>
  <text x="1148" y="543" class="body muted">for local execution and tests.</text>
  <text x="1148" y="584" class="small muted">SQL Server is the Docker default.</text>

  <rect x="56" y="664" width="1328" height="84" rx="10" fill="#EAF5EF"/>
  <path d="m83 689 13-5 13 5v13c0 10-13 17-13 17s-13-7-13-17zm7 12 5 5 9-11" fill="none" stroke="#187653" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="695" font-size="14" font-weight="600" style="fill:#187653">Tenant isolation on every request</text>
  <text x="126" y="721" class="body" style="fill:#187653">HttpOnly cookies → antiforgery checks → role authorization → customer ownership → tenant-scoped queries and writes</text>
</svg>
